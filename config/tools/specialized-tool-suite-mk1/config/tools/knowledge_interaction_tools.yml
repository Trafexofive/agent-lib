# config/tools/knowledge_interaction_tools.yml
# Conceptual tools for interacting with a knowledge base. Scripts are stubs.

KnowledgeInteractionTools:
  StoreTextInKB:
    name: "kb_store_text"
    description: "(Conceptual) Stores a piece of text with metadata into a knowledge base."
    type: "script"
    runtime: "bash"
    path: "../../scripts/knowledge_interaction/kb_store_text.sh"
    parameters_schema:
      type: "object"
      properties:
        text_content: { type: "string", description: "The text to store." }
        source_id: { type: "string", description: "An identifier for the source of the text." }
        tags: { type: "array", items: { type: "string" }, description: "Optional tags for categorization." }
      required: ["text_content", "source_id"]
    example_usage: { "text_content": "The mitochondria is the powerhouse of the cell.", "source_id": "bio101-notes-p5", "tags": ["biology", "cell"] }

  RetrieveSimilarFromKB:
    name: "kb_retrieve_similar"
    description: "(Conceptual) Retrieves texts similar to a query string from the knowledge base."
    type: "script"
    runtime: "bash"
    path: "../../scripts/knowledge_interaction/kb_retrieve_similar.sh"
    parameters_schema:
      type: "object"
      properties:
        query_text: { type: "string", description: "The text to find similar entries for." }
        top_k: { type: "integer", default: 3, description: "Number of similar items to return." }
      required: ["query_text"]
    example_usage: { "query_text": "cellular energy production", "top_k": 5 }
