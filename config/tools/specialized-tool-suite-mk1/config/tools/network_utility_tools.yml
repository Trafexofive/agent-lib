# config/tools/network_utility_tools.yml
# Tools for basic network diagnostics and interactions.

NetworkUtilityTools:
  PingHost:
    name: "net_ping_host"
    description: "Pings a specified host a few times and returns summary or full output."
    type: "script"
    runtime: "bash"
    path: "../../scripts/network_utility/ping_host.sh"
    parameters_schema:
      type: "object"
      properties:
        host: { type: "string", description: "Hostname or IP address to ping." }
        count: { type: "integer", description: "Number of ping attempts.", default: 4 }
      required: ["host"]
    example_usage: { "host": "google.com", "count": 2 }

  CurlUrl:
    name: "net_curl_url"
    description: "Fetches content from a URL using curl. Can specify method, headers, and data. Returns response body and status."
    type: "script"
    runtime: "bash"
    path: "../../scripts/network_utility/curl_url.sh"
    parameters_schema:
      type: "object"
      properties:
        url: { type: "string", description: "The URL to fetch." }
        method: { type: "string", description: "HTTP method (GET, POST, etc.).", default: "GET" }
        headers: { type: "object", description: "Key-value pairs for HTTP headers.", additionalProperties: { type: "string" } }
        data: { type: "string", description: "Data payload for POST/PUT requests." }
        output_format: { type: "string", enum: ["text", "json"], default: "text", description: "Expected format of the response body for parsing."}
      required: ["url"]
    example_usage: { "url": "https://api.example.com/data", "method": "POST", "headers": {"Authorization":"Bearer token"}, "data": "{\"key\":\"value\"}", "output_format": "json" }

  DnsLookup:
    name: "net_dns_lookup"
    description: "Performs a DNS lookup for a given hostname. Returns A records by default, or specified record type."
    type: "script"
    runtime: "bash"
    path: "../../scripts/network_utility/dns_lookup.sh"
    parameters_schema:
      type: "object"
      properties:
        hostname: { type: "string", description: "Hostname to lookup." }
        record_type: { type: "string", description: "DNS record type (A, MX, TXT, ANY, etc.).", default: "A" }
      required: ["hostname"]
    example_usage: { "hostname": "example.com", "record_type": "MX" }
