orchestrations:
  - id: 'generate-docs-on-push'
    alias: 'Generate Docs on Push to main'
    trigger:
      - platform: 'webhook'
        webhook_id: 'github-push-to-main'
    action:
      - service: 'git.clone'
        data:
          repo_url: "{{ trigger.json.repository.ssh_url }}"
          dest_path: "/tmp/docgen/{{ trigger.json.repository.name }}"
      - agent:
          id: 'code-to-docs-agent-v1'
          goal: 'Read the contents of the entire repository located at /tmp/docgen/{{ trigger.json.repository.name }}. Write a comprehensive README.md file explaining the project structure, main application logic, and setup instructions.'
          response_variable: 'generated_readme'
      - service: 'github.create_pull_request'
        data:
          repo: "{{ trigger.json.repository.full_name }}"
          title: 'feat(docs): Auto-generate project documentation'
          branch: 'docs-auto-update'
          base: 'main'
          body: 'This PR was automatically generated by the GAP documentation agent based on the latest commit.'
          files:
            - path: 'README.md'
              content: "{{ generated_readme.content }}"
