# This endgame example demonstrates a sophisticated orchestration where a 'manager' agent
# delegates sub-tasks to a swarm of specialized 'worker' agents who can perform their tasks in parallel.

orchestrations:
  - id: 'agent-swarm-market-analysis'
    alias: 'Agent Swarm for Market Analysis Report'
    description: 'When requested, a Lead Agent decomposes a complex research task and delegates sub-tasks to multiple specialist agents who work in parallel.'

    trigger:
      - platform: 'webhook'
        webhook_id: 'request-market-analysis-report'
        # Expected JSON: { "topic": "Quantum Computing in Healthcare", "depth": "comprehensive" }

    action:
      # Step 1: The Lead Agent creates a plan.
      - agent:
          id: 'lead-research-agent-v2'
          goal: >
            A new market analysis report has been requested on the topic: '{{ trigger.json.topic }}'.
            Decompose this topic into 3-5 distinct sub-topics for parallel research.
            The required depth is '{{ trigger.json.depth }}'.
            Formulate the final list of sub-topics as a JSON array.
          response_variable: 'research_plan'

      # Step 2: The 'swarm' action executes the same agent task for each item in a list.
      # The 'map' defines how to assign items from the list to the agent's goal.
      - swarm:
          # The list of sub-topics generated by the lead agent.
          iterable: "{{ research_plan.json.sub_topics }}"
          # The variable name for each item in the loop.
          loop_variable: 'sub_topic'
          # The agent task to run for each item.
          action:
            - agent:
                id: 'worker-research-agent-v1' # A cheaper, faster agent for focused tasks.
                goal: "Research the specific sub-topic '{{ sub_topic }}' and write a 500-word summary. Focus only on this sub-topic."
          # The results from all worker agents will be collected into this list.
          response_variable: 'swarm_results'

      # Step 3: The Lead Agent synthesizes the final report.
      - agent:
          id: 'lead-research-agent-v2'
          goal: >
            The parallel research is complete. Synthesize the findings from all worker agents into a single, cohesive,
            and well-formatted market analysis report. The original topic was '{{ trigger.json.topic }}'.
            Here is the raw data from the workers: {{ swarm_results | to_json }}
          response_variable: 'final_report'

      # Step 4: Save the final report.
      - service: 'file.write'
        data:
          path: "/data/reports/{{ trigger.json.topic | slugify }}.md"
          content: "{{ final_report.content }}"
