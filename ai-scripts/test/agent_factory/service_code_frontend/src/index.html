<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Factory</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/9.10.2/jsoneditor.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/9.10.2/jsoneditor.min.css" rel="stylesheet" type="text/css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Agent Factory</h1>
            <p>Create and Manage Agent Blueprints</p>
        </header>

        <main>
            <div class="agent-list-panel">
                <h2>Agent Blueprints</h2>
                <button id="createNewAgentBtn">+ Create New Agent</button>
                <ul id="agentList"></ul>
            </div>
            <div class="agent-detail-panel">
                <h2 id="detail-title">Select an Agent</h2>
                <div id="agent-detail-content">
                    <p class="placeholder">Select an agent from the list to see its details or create a new one.</p>
                </div>
                <div id="jsoneditor" style="width: 100%; height: 600px;"></div>
                 <div class="detail-actions">
                    <button id="saveAgentBtn" class="hidden">Save Changes</button>
                    <button id="deleteAgentBtn" class="hidden danger">Delete Agent</button>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
