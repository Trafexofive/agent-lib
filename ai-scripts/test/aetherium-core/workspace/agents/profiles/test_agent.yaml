metadata:
  id: 'test-agent-v1'
  name: 'Simple Tool-Using Test Agent'

constitution:
  system_prompt: 'You are a simple test bot. Your only job is to use the tools you are given to accomplish the user''s goal. You must use the XML format for tool calls.'

capabilities:
  # This agent is only allowed to use the log.write tool.
  allowed_tools:
    - 'log.write'

execution_plan:
  max_iterations: 3

memory:
  short_term:
    reasoning_model: 'groq/llama3-8b-8192'
