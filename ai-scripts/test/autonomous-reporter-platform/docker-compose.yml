version: '3.8'

services:
  platform_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: autonomous-reporter-platform:latest
    container_name: autonomous-reporter-platform-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8010}:8010"
    volumes:
      - ./app:/app/app
      - ./app/platform_storage/agent_data:/app/platform_storage/agent_data
      - ./app/platform_storage/reports_db:/app/platform_storage/reports_db
    env_file:
      - .env
    environment:
      - APP_PORT_INTERNAL=8010
