version: '3.8'

services:
  gateway_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: universal-ai-gateway:latest
    container_name: universal-ai-gateway-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8011}:8011"
    volumes:
      - ./app:/app/app # For live code changes in development
    env_file:
      - .env
    environment:
      - APP_PORT_INTERNAL=8011
