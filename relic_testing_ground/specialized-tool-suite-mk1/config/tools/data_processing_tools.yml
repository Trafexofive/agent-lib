# config/tools/data_processing_tools.yml\n# Tools for basic data manipulation and validation.\n\nDataProcessingTools:\n  JsonValidate:\n    name: "data_json_validate"\n    description: "Validates if a given string is valid JSON. Returns JSON with 'valid' (boolean) and 'error' (string, if invalid)."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/data_processing/json_validate.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        json_string: { type: "string", description: "The JSON string to validate." }\n      required: ["json_string"]\n    example_usage: { "json_string": "{\\\"key\\\": \\\"value\\\"}" }\n\n  JsonQueryJq:\n    name: "data_json_query_jq"\n    description: "Queries a JSON string using a jq filter. Returns the result of the query."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/data_processing/json_query_jq.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        json_string: { type: "string", description: "The input JSON string." }\n        jq_filter: { type: "string", description: "The jq filter string (e.g., '.name', '.items[0].price')." }\n      required: ["json_string", "jq_filter"]\n    example_usage: { "json_string": "{\\\"user\\\":{\\\"name\\\":\\\"Alice\\\",\\\"age\\\":30}}", "jq_filter": ".user.name" }\n\n  TextSearchGrep:\n    name: "data_text_search_grep"\n    description: "Searches for a pattern in a given text string (similar to grep). Returns JSON with 'matches' (array of matching lines) and 'count'."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/data_processing/text_search_grep.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        text_content: { type: "string", description: "The text to search within." }\n        pattern: { type: "string", description: "The ERE pattern to search for." }\n        ignore_case: { type: "boolean", default: false, description: "Perform case-insensitive matching." }\n      required: ["text_content", "pattern"]\n    example_usage: { "text_content": "Hello world\\nHello there", "pattern": "^Hello", "ignore_case": true }\n