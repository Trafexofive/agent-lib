# config/tools/file_system_tools.yml\n# Tools for detailed file and directory operations.\n\nFileSystemTools:\n  ReadFileContent:\n    name: "fs_read_file"\n    description: "Reads the entire content of a specified file. Returns content as a string."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/file_system/read_content.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        path: { type: "string", description: "Absolute or relative path to the file." }\n      required: ["path"]\n    example_usage: { "path": "/tmp/my_document.txt" }\n\n  WriteFileContent:\n    name: "fs_write_file"\n    description: "Writes (or overwrites) content to a specified file. Creates parent directories if they don't exist."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/file_system/write_content.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        path: { type: "string", description: "Absolute or relative path to the file." }\n        content: { type: "string", description: "The content to write to the file." }\n      required: ["path", "content"]\n    example_usage: { "path": "data/output.log", "content": "Log entry: Process started." }\n\n  AppendFileContent:\n    name: "fs_append_file"\n    description: "Appends content to a specified file. Creates the file and parent directories if they don't exist."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/file_system/append_content.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        path: { type: "string", description: "Path to the file." }\n        content: { type: "string", description: "Content to append." }\n      required: ["path", "content"]\n    example_usage: { "path": "data/output.log", "content": "\\nLog entry: Process continued." }\n\n  ListDirectoryDetailed:\n    name: "fs_list_directory_detailed"\n    description: "Lists contents of a directory with details (type, size, permissions, mtime). Returns JSON array."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/file_system/list_detailed.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        path: { type: "string", description: "Path to the directory." }\n      required: ["path"]\n    example_usage: { "path": "./config" }\n\n  CheckExistence:\n    name: "fs_check_existence"\n    description: "Checks if a file or directory exists at the given path. Returns JSON with 'exists' (boolean) and 'type' ('file', 'directory', or 'not_found')."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/file_system/check_existence.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        path: { type: "string", description: "Path to check." }\n      required: ["path"]\n    example_usage: { "path": "/etc/hosts" }\n\n  GetFileProperties:\n    name: "fs_get_file_properties"\n    description: "Gets properties (size, mtime, type, permissions) for a specific file or directory. Returns JSON."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/file_system/get_properties.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        path: { type: "string", description: "Path to the file or directory." }\n      required: ["path"]\n    example_usage: { "path": "requirements.txt" }\n\n  CreateTarArchive:\n    name: "fs_create_tar_archive"\n    description: "Creates a .tar.gz archive from a source path (file or directory) at a specified destination path."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/file_system/create_tar_archive.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        source_path: { type: "string", description: "Path to the file or directory to archive." }\n        destination_archive_path: { type: "string", description: "Full path for the output .tar.gz file." }\n        archive_base_name: { type: "string", description: "Optional. Name of the base directory inside the archive. Defaults to source_path basename." }\n      required: ["source_path", "destination_archive_path"]\n    example_usage: { "source_path": "./app", "destination_archive_path": "/tmp/app_backup.tar.gz", "archive_base_name": "my_application" }\n\n  ExtractTarArchive:\n    name: "fs_extract_tar_archive"\n    description: "Extracts a .tar.gz archive to a specified destination directory."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/file_system/extract_tar_archive.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        archive_path: { type: "string", description: "Path to the .tar.gz file." }\n        destination_dir: { type: "string", description: "Directory to extract contents into." }\n      required: ["archive_path", "destination_dir"]\n    example_usage: { "archive_path": "/tmp/app_backup.tar.gz", "destination_dir": "./restored_app" }\n