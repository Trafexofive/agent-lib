# config/tools/code_utility_tools.yml\n# Tools for basic code interactions like linting or metrics.\n\nCodeUtilityTools:\n  CountLinesOfCode:\n    name: "code_count_lines"\n    description: "Counts lines in a specified text file (source code, text). Returns JSON with 'file', 'lines', 'words', 'bytes'."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/code_utility/count_lines.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        file_path: { type: "string", description: "Path to the file." }\n      required: ["file_path"]\n    example_usage: { "file_path": "app/main.py" }\n\n  SimplePythonLint:\n    name: "code_simple_lint_python"\n    description: "Performs a very basic lint check on a Python file using 'python -m py_compile'. Returns JSON with 'status' ('ok' or 'error') and 'message'."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/code_utility/simple_lint_python.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        file_path: { type: "string", description: "Path to the Python file to check." }\n      required: ["file_path"]\n    example_usage: { "file_path": "utils/helpers.py" }\n