# config/tools/network_utility_tools.yml\n# Tools for basic network diagnostics and interactions.\n\nNetworkUtilityTools:\n  PingHost:\n    name: "net_ping_host"\n    description: "Pings a specified host a few times and returns summary or full output."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/network_utility/ping_host.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        host: { type: "string", description: "Hostname or IP address to ping." }\n        count: { type: "integer", description: "Number of ping attempts.", default: 4 }\n      required: ["host"]\n    example_usage: { "host": "google.com", "count": 2 }\n\n  CurlUrl:\n    name: "net_curl_url"\n    description: "Fetches content from a URL using curl. Can specify method, headers, and data. Returns response body and status."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/network_utility/curl_url.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        url: { type: "string", description: "The URL to fetch." }\n        method: { type: "string", description: "HTTP method (GET, POST, etc.).", default: "GET" }\n        headers: { type: "object", description: "Key-value pairs for HTTP headers.", additionalProperties: { type: "string" } }\n        data: { type: "string", description: "Data payload for POST/PUT requests." }\n        output_format: { type: "string", enum: ["text", "json"], default: "text", description: "Expected format of the response body for parsing."}\n      required: ["url"]\n    example_usage: { "url": "https://api.example.com/data", "method": "POST", "headers": {"Authorization":"Bearer token"}, "data": "{\\\"key\\\":\\\"value\\\"}", "output_format": "json" }\n\n  DnsLookup:\n    name: "net_dns_lookup"\n    description: "Performs a DNS lookup for a given hostname. Returns A records by default, or specified record type."\n    type: "script"\n    runtime: "bash"\n    path: "../../scripts/network_utility/dns_lookup.sh"\n    parameters_schema:\n      type: "object"\n      properties:\n        hostname: { type: "string", description: "Hostname to lookup." }\n        record_type: { type: "string", description: "DNS record type (A, MX, TXT, ANY, etc.).", default: "A" }\n      required: ["hostname"]\n    example_usage: { "hostname": "example.com", "record_type": "MX" }\n