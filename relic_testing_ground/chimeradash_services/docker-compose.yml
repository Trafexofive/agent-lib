# Top-level 'version' attribute removed as it's obsolete.

services:
  chimeradash-backend:
    build:
      context: ./backend_service_code
      dockerfile: Dockerfile
    container_name: chimeradash_backend_container
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend_service_code:/app # For development: hot-reloading
      - backend_data:/app/data
    env_file:
      - .env
    networks:
      - chimeradash_network
    restart: unless-stopped

  chimeradash-frontend:
    build:
      context: ./frontend_service_code 
      dockerfile: Dockerfile
    container_name: chimeradash_frontend_container
    ports:
      - "${FRONTEND_PORT:-3000}:80" # Nginx serves on port 80 in container
    environment:
      - API_BASE_URL=http://chimeradash-backend:8000
      - VITE_API_BASE_URL=http://chimeradash-backend:8000 # For Vite to pick up during build or runtime if configured
    depends_on:
      - chimeradash-backend
    networks:
      - chimeradash_network
    restart: unless-stopped

volumes:
  backend_data:
    driver: local

networks:
  chimeradash_network:
    driver: bridge
