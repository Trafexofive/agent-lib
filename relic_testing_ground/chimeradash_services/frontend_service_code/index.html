<style id="dynamic-theme-styles">
  /* CSS variables will be injected here by JavaScript */
  :root {
    /* Default fallback theme (similar to original slate) */
    --theme-bg-primary: #0F172A; /* slate-900 */
    --theme-bg-secondary: #1E293B; /* slate-800 */
    --theme-bg-accent: #334155; /* slate-700 */
    --theme-text-primary: #F1F5F9; /* slate-100 */
    --theme-text-secondary: #94A3B8; /* slate-400 */
    --theme-accent-primary: #0EA5E9; /* sky-500 */
    --theme-accent-secondary: #EC4899; /* pink-500 */
    --theme-border-primary: #334155; /* slate-700 */
    --theme-success: #22C55E; /* green-500 */
    --theme-error: #EF4444; /* red-500 */
    --theme-info: #3B82F6; /* blue-500 */

    --theme-button-primary-bg: var(--theme-accent-primary);
    --theme-button-primary-text: var(--theme-text-primary);
    --theme-sidebar-bg: var(--theme-bg-secondary);
    --theme-sidebar-text: var(--theme-text-primary);
    --theme-sidebar-accent: var(--theme-accent-primary);
    --theme-topbar-bg: var(--theme-bg-secondary);
    --theme-card-bg: var(--theme-bg-secondary);
    --theme-modal-bg: var(--theme-bg-accent);
    --theme-input-bg: var(--theme-bg-accent);
    --theme-input-border: var(--theme-border-primary);
    --theme-input-text: var(--theme-text-primary);

    --theme-font-family-body: 'Inter', sans-serif;
    --theme-font-family-title: 'Orbitron', sans-serif;
  }
  body {
    font-family: var(--theme-font-family-body);
  }
  h1,h2,h3,h4,h5,h6 {
    font-family: var(--theme-font-family-title);
  }
</style>
